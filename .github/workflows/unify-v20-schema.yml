name: Unify V20 shared schema
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-v20-schema.yml'
      - '.github/scripts/unify_v20_schema.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewire Guided and Advanced to shared schema
        run: python .github/scripts/unify_v20_schema.py
      - name: Validate JavaScript
        run: |
          node --check shared-v20.js
          node --check config.js
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('legacy.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Embedded module script not found')
          Path('/tmp/legacy-v20.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/legacy-v20.js
      - name: Commit unified schema consumers
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html config.js app.js legacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make Guided and Advanced consume shared V20 schema"
          git push
