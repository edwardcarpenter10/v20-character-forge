name: Apply V20 Merit Flaw engine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-merit-flaw-engine.yml'
      - '.github/scripts/apply_merit_flaw_engine.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guided Forge
        run: python .github/scripts/apply_merit_flaw_engine.py
      - name: Validate guided JavaScript
        run: |
          node --check shared-v20.js
          node --check config.js
          node --check app.js
      - name: Commit patch
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply V20 Merit and Flaw effects in guided Forge"
          git push
