name: Fix Sabbat Virtue pool
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sabbat-virtues.yml'
      - '.github/scripts/fix_sabbat_virtues.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Sabbat Virtue pool
        run: python .github/scripts/fix_sabbat_virtues.py
      - name: Commit correction
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js config.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct Sabbat Virtue pool to seven dots"
          git push
