name: Fix guided V20 creation rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-guided-v20-rules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guided V20 rules and derived ratings
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label, count=1):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Missing source for {label}')
              return text.replace(old, new, count)

          p = Path('app.js')
          text = p.read_text(encoding='utf-8')

          # State stores the two virtue choices independently.
          text = rep(text,
              'buildMode: "standard",\n      identity:',
              'buildMode: "standard",\n      virtueTypes: { ethics: "conscience", control: "selfControl" },\n      identity:',
              'virtue type state')
          text = rep(text,
              'const merged = { ...base, ...raw };\n    merged.identity =',
              'const merged = { ...base, ...raw };\n    merged.virtueTypes = { ...base.virtueTypes, ...(raw.virtueTypes || {}) };\n    merged.identity =',
              'virtue type normalization')

          # Helpers for dynamic virtue labels/minima, Sabbat pools, and derived ratings.
          marker = '''  function specialDefault(s, identity = state.identity) {
    if (!s.fromIdentity) return Number(s.default || 0);
    const chosen = identity[s.fromIdentity.key];
    const mapped = s.fromIdentity.map[chosen];
    return Number(mapped ?? s.default ?? 0);
  }
'''
          replacement = '''  function isVirtueGroup(g) { return g?.id === "virtues"; }
  function traitLabel(g, trait, sourceState = state) {
    if (!isVirtueGroup(g)) return trait;
    if (trait === "Conscience / Conviction") return sourceState.virtueTypes?.ethics === "conviction" ? "Conviction" : "Conscience";
    if (trait === "Self-Control / Instinct") return sourceState.virtueTypes?.control === "instinct" ? "Instinct" : "Self-Control";
    return trait;
  }
  function groupFreeDot(g, trait, sourceState = state) {
    if (isVirtueGroup(g)) {
      if (trait === "Conscience / Conviction") return sourceState.virtueTypes?.ethics === "conviction" ? 0 : 1;
      if (trait === "Self-Control / Instinct") return sourceState.virtueTypes?.control === "instinct" ? 0 : 1;
      if (trait === "Courage") return 1;
    }
    return Number((g.freeDots || {})[trait] || 0);
  }
  function traitMin(g, trait, sourceState = state) {
    if (isVirtueGroup(g)) return groupFreeDot(g, trait, sourceState);
    return Number(g.min ?? 0);
  }
  function groupAllowance(g, p = profile(), sourceState = state) {
    if (p.id === "vampire" && sourceState.identity?.sect === "Sabbat") {
      if (g.id === "disciplines") return 4;
      if (g.id === "backgrounds") return 0;
      if (g.id === "virtues") return 5;
    }
    return Number(g.pool || 0);
  }
  function specialDefault(s, identity = state.identity, sourceState = state) {
    if (s.id === "morality" && sourceState.ratings?.virtues) {
      return Number(sourceState.ratings.virtues["Conscience / Conviction"]?.base || 0) + Number(sourceState.ratings.virtues["Self-Control / Instinct"]?.base || 0);
    }
    if (s.id === "willpower" && sourceState.ratings?.virtues) return Number(sourceState.ratings.virtues.Courage?.base || 1);
    if (!s.fromIdentity) return Number(s.default || 0);
    const chosen = identity[s.fromIdentity.key];
    const mapped = s.fromIdentity.map[chosen];
    return Number(mapped ?? s.default ?? 0);
  }
  function derivedSpecialStarts(sourceState = state) {
    const p = C.profiles.find(x => x.id === sourceState.profileId) || C.profiles[0];
    return Object.fromEntries((p.specials || []).filter(s => s.id === "morality" || s.id === "willpower").map(s => [s.id, specialDefault(s, sourceState.identity, sourceState)]));
  }
  function preserveDerivedPurchases(beforeStarts) {
    const afterStarts = derivedSpecialStarts(state);
    Object.entries(afterStarts).forEach(([id, nextBase]) => {
      const previousBase = Number(beforeStarts[id] ?? nextBase);
      const currentValue = Number(state.specialBase[id] ?? previousBase);
      state.specialBase[id] = Math.max(nextBase, currentValue + (nextBase - previousBase));
    });
  }
'''
          text = rep(text, marker, replacement, 'dynamic V20 helpers')

          # Fresh ratings honor dynamic minima/free dots, and specials derive from those ratings.
          text = rep(text,
              'const free = Number((g.freeDots || {})[trait] || 0);\n        base.ratings[g.id][trait] = { base: Math.max(g.min, free), xp: 0 };',
              'const free = groupFreeDot(g, trait, base);\n        base.ratings[g.id][trait] = { base: Math.max(traitMin(g, trait, base), free), xp: 0 };',
              'fresh virtue ratings')
          text = rep(text,
              'base.specialBase[s.id] = specialDefault(s, base.identity);',
              'base.specialBase[s.id] = specialDefault(s, base.identity, base);',
              'fresh derived specials')

          # Normalize old saves. Old Path/Willpower values are floored to the actual virtue-derived creation base.
          text = rep(text,
              'merged.ratings[g.id][t] = { base: Number(existing?.base ?? g.min), xp: Number(existing?.xp || 0) };',
              'merged.ratings[g.id][t] = { base: Math.max(traitMin(g, t, merged), Number(existing?.base ?? traitMin(g, t, merged))), xp: Number(existing?.xp || 0) };',
              'normalized trait minima')
          text = rep(text,
              'merged.specialBase = { ...base.specialBase, ...(raw.specialBase || {}) };\n    merged.specialXp =',
              'merged.specialBase = { ...base.specialBase, ...(raw.specialBase || {}) };\n    (C.profiles.find(p => p.id === merged.profileId)?.specials || []).forEach(s => {\n      if (s.id === "morality" || s.id === "willpower") merged.specialBase[s.id] = Math.max(specialDefault(s, merged.identity, merged), Number(merged.specialBase[s.id] ?? 0));\n    });\n    merged.specialXp =',
              'derived special save migration')

          # Creation spend uses the chosen virtue's real free dot and sect-aware allowance.
          text = rep(text,
              '...g.traits.map(name => ({ name, base: baseRating(g.id, name), free: Number((g.freeDots || {})[name] || 0) })),',
              '...g.traits.map(name => ({ name, base: baseRating(g.id, name), free: groupFreeDot(g, name, state) })),',
              'dynamic free dots in ledger')
          text = rep(text,
              'allowance = Number(g.pool || 0);',
              'allowance = groupAllowance(g, p, state);',
              'sect-aware group allowance')
          text = text.replace('const start = specialDefault(s);', 'const start = specialDefault(s, state.identity, state);')

          # Dot controls use dynamic labels and minima.
          text = rep(text,
              'let html = \'<span class="dots" role="group" aria-label="\' + attr(trait) + \' rating">\';',
              'const shownTrait = traitLabel(g, trait, state);\n    let html = \'<span class="dots" role="group" aria-label="\' + attr(shownTrait) + \' rating">\';',
              'dynamic dot labels')
          text = rep(text,
              'aria-label="Set ${attr(trait)} creation rating to ${i}"',
              'aria-label="Set ${attr(shownTrait)} creation rating to ${i}"',
              'dynamic dot aria labels')

          # Virtue type toggles live with the Virtues group.
          insert_before = '  function renderRatedGroup(g) {\n'
          toggle_fn = '''  function renderVirtueTypeToggles(g) {
    if (!isVirtueGroup(g)) return "";
    const ethics = state.virtueTypes?.ethics || "conscience";
    const control = state.virtueTypes?.control || "selfControl";
    return `<div class="terminology-options" role="group" aria-label="Virtue types">
      <button type="button" data-action="virtue-type" data-axis="ethics" data-value="conscience" class="${ethics === "conscience" ? "selected" : ""}" aria-pressed="${ethics === "conscience"}"><b>Conscience</b><span>Begins with one automatic dot.</span></button>
      <button type="button" data-action="virtue-type" data-axis="ethics" data-value="conviction" class="${ethics === "conviction" ? "selected" : ""}" aria-pressed="${ethics === "conviction"}"><b>Conviction</b><span>Begins at zero.</span></button>
      <button type="button" data-action="virtue-type" data-axis="control" data-value="selfControl" class="${control === "selfControl" ? "selected" : ""}" aria-pressed="${control === "selfControl"}"><b>Self-Control</b><span>Begins with one automatic dot.</span></button>
      <button type="button" data-action="virtue-type" data-axis="control" data-value="instinct" class="${control === "instinct" ? "selected" : ""}" aria-pressed="${control === "instinct"}"><b>Instinct</b><span>Begins at zero.</span></button>
    </div>`;
  }

'''
          text = rep(text, insert_before, toggle_fn + insert_before, 'virtue toggle renderer')
          text = rep(text,
              'const spent = groupSpend(g);\n    return `<section class="rated-list"><header><h3>${esc(groupLabel(g))}</h3><span class="budget-label ${spent > Number(g.pool || 0) ? "over" : spent === Number(g.pool || 0) ? "ok" : ""}">${spent} / ${Number(g.pool || 0)}</span></header>\n      ${g.traits.map(trait => `<div class="trait-row"><span>${esc(trait)}</span>${renderDots(g, trait)}</div>`).join("")}',
              'const spent = groupSpend(g);\n    const allowance = groupAllowance(g, profile(), state);\n    return `<section class="rated-list"><header><h3>${esc(groupLabel(g))}</h3><span class="budget-label ${spent > allowance ? "over" : spent === allowance ? "ok" : ""}">${spent} / ${allowance}</span></header>\n      ${renderVirtueTypeToggles(g)}\n      ${g.traits.map(trait => `<div class="trait-row"><span>${esc(traitLabel(g, trait, state))}</span>${renderDots(g, trait)}</div>`).join("")}',
              'sect-aware rated group and virtue labels')

          # Core ratings show actual totals and cannot be lowered below their derived creation base.
          text = rep(text,
              'const total = Number(state.specialBase[s.id] || 0) + Number(state.specialXp[s.id] || 0);\n        return `<div class="special-card"><label for="special-${attr(s.id)}">${esc(specialLabel(s))}</label><strong>${total}${state.specialXp[s.id] ? ` <small>(+${state.specialXp[s.id]} XP)</small>` : ""}</strong><input id="special-${attr(s.id)}" type="number" min="${s.min ?? 0}" max="${s.max ?? 10}" data-special="${attr(s.id)}" value="${Number(state.specialBase[s.id] ?? specialDefault(s))}"><small>${esc(s.help || `Standard start: ${specialDefault(s)}`)}</small></div>`;',
              'const start = specialDefault(s, state.identity, state);\n        const total = Math.max(start, Number(state.specialBase[s.id] ?? start)) + Number(state.specialXp[s.id] || 0);\n        return `<div class="special-card"><label for="special-${attr(s.id)}">${esc(specialLabel(s))}</label><strong>${total}${state.specialXp[s.id] ? ` <small>(+${state.specialXp[s.id]} XP)</small>` : ""}</strong><input id="special-${attr(s.id)}" type="number" min="${Math.max(Number(s.min ?? 0), start)}" max="${s.max ?? 10}" data-special="${attr(s.id)}" value="${Math.max(start, Number(state.specialBase[s.id] ?? start))}"><small>${esc(s.help || `Creation base: ${start}`)}</small></div>`;',
              'derived core ratings UI')

          # Review, print, and XP menus use chosen Virtue names.
          text = rep(text,
              'g.traits.forEach(t => rows.push({ group: g.id, trait: t, label: `${groupLabel(g)} · ${t}` }));',
              'g.traits.forEach(t => rows.push({ group: g.id, trait: t, label: `${groupLabel(g)} · ${traitLabel(g, t, state)}` }));',
              'XP virtue labels')
          text = rep(text,
              'g.traits.forEach(t => { const value = current(g.id, t); if (value > g.min) rows.push([t, value]); });',
              'g.traits.forEach(t => { const value = current(g.id, t); if (value > traitMin(g, t, state)) rows.push([traitLabel(g, t, state), value]); });',
              'review virtue labels')
          text = rep(text,
              'g.traits.map(t => [t, current(g.id, t)])',
              'g.traits.map(t => [traitLabel(g, t, state), current(g.id, t)])',
              'print virtue labels')
          text = rep(text,
              'const specials = (p.specials || []).map(s => [specialLabel(s), Number(state.specialBase[s.id] || 0) + Number(state.specialXp[s.id] || 0)]);',
              'const specials = (p.specials || []).map(s => { const start = specialDefault(s, state.identity, state); return [specialLabel(s), Math.max(start, Number(state.specialBase[s.id] ?? start)) + Number(state.specialXp[s.id] || 0)]; });',
              'printed derived specials')

          # Editing Virtues updates derived Path/Humanity and Willpower while preserving purchased increases.
          text = rep(text,
              'if (custom) custom.base = custom.base === value ? Math.max(g.min, value - 1) : value;\n      else {\n        const row = state.ratings[g.id][button.dataset.trait];\n        row.base = row.base === value ? Math.max(g.min, value - 1) : value;\n      }\n      return commit();',
              'const beforeStarts = isVirtueGroup(g) ? derivedSpecialStarts(state) : null;\n      const minimum = traitMin(g, button.dataset.trait, state);\n      if (custom) custom.base = custom.base === value ? Math.max(minimum, value - 1) : value;\n      else {\n        const row = state.ratings[g.id][button.dataset.trait];\n        row.base = row.base === value ? Math.max(minimum, value - 1) : value;\n      }\n      if (beforeStarts) preserveDerivedPurchases(beforeStarts);\n      return commit();',
              'derived ratings on virtue dot change')

          # Add virtue-toggle click handling before rating handling.
          text = rep(text,
              '    if (action === "rating") {\n',
              '''    if (action === "virtue-type") {
      const g = allGroups().find(x => x.id === "virtues");
      if (!g) return;
      const axis = button.dataset.axis;
      const next = button.dataset.value;
      const currentType = state.virtueTypes?.[axis];
      if (!axis || !next || currentType === next) return;
      const beforeStarts = derivedSpecialStarts(state);
      const trait = axis === "ethics" ? "Conscience / Conviction" : "Self-Control / Instinct";
      const beforeFree = groupFreeDot(g, trait, state);
      state.virtueTypes[axis] = next;
      const afterFree = groupFreeDot(g, trait, state);
      const row = state.ratings.virtues?.[trait];
      if (row) row.base = Math.max(afterFree, Number(row.base || 0) + (afterFree - beforeFree));
      preserveDerivedPurchases(beforeStarts);
      if ((next === "conviction" || next === "instinct") && String(state.identity.moralityName || "").trim().toLowerCase() === "humanity") state.identity.moralityName = "Path of Enlightenment";
      return commit();
    }
    if (action === "rating") {
''',
              'virtue toggle action')

          # Manual core-rating edits respect the derived floor.
          text = rep(text,
              'state.specialBase[el.dataset.special] = Number(el.value);',
              'const s = (profile().specials || []).find(x => x.id === el.dataset.special);\n      const start = s ? specialDefault(s, state.identity, state) : 0;\n      state.specialBase[el.dataset.special] = Math.max(start, Number(el.value));',
              'core rating floor on input')

          p.write_text(text, encoding='utf-8')

          # V20 configuration: allow alternate Virtues to start at zero and explain derived ratings/Sabbat package.
          p = Path('config.js')
          text = p.read_text(encoding='utf-8')
          text = rep(text,
              'rulesNote: "Standard V20 creation uses 7/5/3 Attributes, 13/9/5 Abilities, three Discipline dots, five Background dots, seven Virtue dots, and 15 freebies. Use the Advanced Vampire workspace for clan auto-fill, blood magic paths and rituals, Sect terminology, and detailed Generation limits.",',
              'rulesNote: "Standard V20 creation uses 7/5/3 Attributes, 13/9/5 Abilities, three Discipline dots, five Background dots, seven Virtue dots, and 15 freebies. Selecting Sabbat uses the Forge’s classic Sabbat package: four Discipline dots, zero free Background dots, five Virtue dots, and 15 freebies. Conscience/Conviction and Self-Control/Instinct are chosen independently; alternate Virtues begin at zero. Path/Humanity and Willpower derive automatically from Virtues, with freebies buying only increases above those bases.",',
              'V20 rules note')
          text = rep(text,
              '{ id: "virtues", kind: "virtue", label: "Virtues", pool: 7, freebieCost: 2, xpMult: 2, min: 1, freeDots: { "Conscience / Conviction": 1, "Self-Control / Instinct": 1, Courage: 1 }, traits: ["Conscience / Conviction", "Self-Control / Instinct", "Courage"], note: "Allocate seven dots beyond the automatic one in each Virtue." }',
              '{ id: "virtues", kind: "virtue", label: "Virtues", pool: 7, freebieCost: 2, xpMult: 2, min: 0, traits: ["Conscience / Conviction", "Self-Control / Instinct", "Courage"], note: "Choose each Virtue pair independently. Conscience, Self-Control, and Courage begin with one automatic dot; Conviction and Instinct begin at zero. The displayed creation pool excludes those automatic dots." }',
              'vampire virtue configuration')
          text = text.replace('help: "Normally begins at the sum of the two governing Virtues; adjust after allocating Virtues."', 'help: "Automatically begins at the sum of the two governing Virtues. Raise it above that base with freebies."')
          text = text.replace('help: "Normally begins at Courage; adjust after allocating Virtues."', 'help: "Automatically begins at Courage. Raise it above that base with freebies."')
          # Other V20 templates also allow Path Virtue choices and therefore need a zero minimum.
          text = text.replace('kind: "virtue", label: "Virtues", pool: 7, freebieCost: 2, xpMult: 2, min: 1, freeDots: { "Conscience / Conviction": 1, "Self-Control / Instinct": 1, Courage: 1 }, traits: ["Conscience / Conviction", "Self-Control / Instinct", "Courage"]', 'kind: "virtue", label: "Virtues", pool: 7, freebieCost: 2, xpMult: 2, min: 0, traits: ["Conscience / Conviction", "Self-Control / Instinct", "Courage"]')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js config.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix guided V20 Sabbat, Virtues, Path, and Willpower"
          git push
