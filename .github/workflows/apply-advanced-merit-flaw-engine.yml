name: Apply Advanced V20 Merit Flaw engine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-advanced-merit-flaw-engine.yml'
      - '.github/scripts/apply_advanced_merit_flaw_engine.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Advanced Forge
        run: python .github/scripts/apply_advanced_merit_flaw_engine.py
      - name: Validate shared and Advanced JavaScript
        run: |
          node --check shared-v20.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('legacy.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Embedded module script not found')
          Path('/tmp/legacy-v20.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/legacy-v20.js
      - name: Commit patch
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add legacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply V20 Merit and Flaw effects in Advanced Forge"
          git push
