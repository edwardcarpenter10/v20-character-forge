name: Fix guided V20 rules v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-guided-v20-rules-v3.yml'
      - '.github/scripts/fix_guided_v20.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repairs
        run: python .github/scripts/fix_guided_v20.py
      - name: Commit repairs
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js config.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix guided V20 Sabbat, Virtues, core ratings, and Flaws"
          git push
