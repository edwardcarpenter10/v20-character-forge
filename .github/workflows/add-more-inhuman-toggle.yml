name: Add More Inhuman Vampires toggle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-more-inhuman-toggle.yml'
      - '.github/scripts/add_more_inhuman_toggle.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply toggle patch
        run: python .github/scripts/add_more_inhuman_toggle.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check config.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('legacy.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Embedded module script not found')
          Path('/tmp/legacy-v20.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/legacy-v20.js
      - name: Commit patch
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js config.js legacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add More Inhuman Vampires creation toggle"
          git push
