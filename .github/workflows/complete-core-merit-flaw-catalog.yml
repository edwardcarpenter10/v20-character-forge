name: Complete V20 core Merit Flaw catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-core-merit-flaw-catalog.yml'
      - '.github/scripts/complete_core_merit_flaw_catalog.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete shared catalog and validators
        run: python .github/scripts/complete_core_merit_flaw_catalog.py
      - name: Validate JavaScript
        run: |
          node --check shared-v20.js
          node --check app.js
          node --check config.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('legacy.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match: raise SystemExit('Embedded module script not found')
          Path('/tmp/legacy-v20.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/legacy-v20.js
      - name: Commit catalog
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add shared-v20.js app.js legacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete core V20 Merit and Flaw rules catalog"
          git push
