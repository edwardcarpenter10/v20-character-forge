name: Sync Advanced V20 identity parity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-advanced-identity.yml'
      - '.github/scripts/sync_advanced_identity.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Advanced identity parity patch
        run: python .github/scripts/sync_advanced_identity.py
      - name: Validate Advanced bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('legacy.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Embedded module script not found')
          Path('/tmp/legacy-v20.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/legacy-v20.js
      - name: Commit patch
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add legacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Advanced V20 identity options with guided Forge"
          git push
