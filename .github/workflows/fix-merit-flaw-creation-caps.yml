name: Fix V20 Merit Flaw cap semantics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-merit-flaw-creation-caps.yml'
      - '.github/scripts/fix_merit_flaw_creation_caps.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct creation-only effect semantics
        run: python .github/scripts/fix_merit_flaw_creation_caps.py
      - name: Validate JavaScript
        run: |
          node --check shared-v20.js
          node --check app.js
          node --check config.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('legacy.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match: raise SystemExit('Embedded module script not found')
          Path('/tmp/legacy-v20.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/legacy-v20.js
      - name: Commit fix
        run: |
          git config user.name "Lantern & Lever Forge Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js legacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct creation-only Merit and Flaw caps"
          git push
