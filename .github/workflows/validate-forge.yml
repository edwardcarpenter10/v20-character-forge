name: Validate Character Forge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared-v20.js'
      - 'index.html'
      - 'app.js'
      - 'config.js'
      - 'legacy.html'
      - '.github/scripts/validate_shared_v20.py'
      - '.github/workflows/validate-forge.yml'
  pull_request:
    paths:
      - 'shared-v20.js'
      - 'index.html'
      - 'app.js'
      - 'config.js'
      - 'legacy.html'
      - '.github/scripts/validate_shared_v20.py'
      - '.github/workflows/validate-forge.yml'
jobs:
  syntax-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check guided JavaScript
        run: |
          node --check shared-v20.js
          node --check app.js
          node --check config.js
      - name: Check Advanced embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('legacy.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Embedded module script not found')
          Path('/tmp/legacy-v20.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/legacy-v20.js
      - name: Check shared-schema consumers
        run: python .github/scripts/validate_shared_v20.py
      - name: Check Guided schema parity and Merit Flaw rules at runtime
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('shared-v20.js', 'utf8'), context);
          vm.runInContext(fs.readFileSync('config.js', 'utf8'), context);
          const shared = context.window.V20_SHARED;
          const config = context.window.FORGE_CONFIG;
          const vampire = config.profiles.find(p => p.id === 'vampire');
          const field = key => vampire.identityFields.find(f => f.key === key);
          const group = id => vampire.groups.find(g => g.id === id);
          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          if (!same(field('clan').options, shared.clanOptions)) throw new Error('Clan parity failed');
          if (!same(field('sect').options, shared.sects)) throw new Error('Sect parity failed');
          if (!same(field('generation').options, shared.generationOptions)) throw new Error('Generation parity failed');
          if (!same(group('disciplines').traits, shared.disciplines)) throw new Error('Discipline parity failed');
          if (!same(group('backgrounds').traits, shared.backgrounds)) throw new Error('Background parity failed');
          if (group('disciplines').pool !== shared.creationPackages.standard.disciplines) throw new Error('Standard Discipline pool parity failed');
          if (group('backgrounds').pool !== shared.creationPackages.standard.backgrounds) throw new Error('Standard Background pool parity failed');
          if (group('virtues').pool !== shared.creationPackages.standard.virtues) throw new Error('Virtue pool parity failed');

          const monstrous = shared.resolveMeritFlawRule('monsterous', 'flaw');
          if (!monstrous || monstrous.name !== 'Monstrous') throw new Error('Monstrous alias resolution failed');
          const monstrousCap = monstrous.effects.find(e => e.type === 'traitCap' && e.group === 'attribute:Social' && e.trait === 'Appearance');
          if (!monstrousCap || monstrousCap.cap !== 0) throw new Error('Monstrous Appearance effect failed');
          const child = shared.resolveMeritFlawRule('Child', 'flaw');
          if (!child.effects.some(e => e.type === 'creationTraitCap' && e.trait === 'Strength' && e.cap === 2)) throw new Error('Child creation cap failed');
          const magicResistance = shared.resolveMeritFlawRule('Magic Resistance', 'merit');
          const forbid = magicResistance.effects.find(e => e.type === 'forbidTraits');
          if (!forbid || !forbid.traits.includes('Thaumaturgy') || !forbid.traits.includes('Necromancy')) throw new Error('Magic Resistance prohibition failed');
          const naturalLeader = shared.resolveMeritFlawRule('Natural Leader', 'merit');
          if (!naturalLeader.requirements.some(r => r.type === 'attributeMin' && r.trait === 'Charisma' && r.value === 3)) throw new Error('Natural Leader prerequisite failed');
          const redList = shared.resolveMeritFlawRule('Red List', 'flaw');
          if (!redList || redList.cost !== 7) throw new Error('Red List cost failed');
          if (shared.meritFlawDetail('Additional Discipline: Protean') !== 'Protean') throw new Error('Additional Discipline detail parsing failed');
          console.log('Guided shared-schema and Merit/Flaw runtime checks passed.');
          NODE
